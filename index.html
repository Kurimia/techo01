<style>html,body{height:100%}body{margin:0;font-size:14px;font-family:system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: a fixed 1133x744 iPad-mini landscape "device" scaled to fit the window; book view and page view swap inside it */
:root{
  --bg:#FAFAF9;--surface:#FFFFFF;--panel:#F4F4F3;--rail:#EDEDEC;--ink:#1C1C1E;--sub:#5F6166;--muted:#8C8E93;--border:#E2E2E4;
  --l-hour:rgba(0,0,0,0.18);--l-half:rgba(0,0,0,0.07);--l-col:rgba(0,0,0,0.11);--weekend:rgba(0,0,0,0.025);
  --seg:#ECECED;--seg-on:#FFFFFF;--ev-b:#6E7076;--now:#2F6FD1;--today:#2F6FD1;--sat:#4A5A80;--sun:#B5453C;--btn:#1C1C1E;--btn-t:#FFFFFF;--sw-off:#C6C7CB;--done:#2F6FD1;
  --pen-k:#1C1C1E;--pen-b:#2B4EA8;--pen-r:#C8483E;--pen-mc:#38BDF0;--pen-mp:#FF5FA8;--pen-my:#D6E96D;
  --sbar:#2A2A2D;--desk:#E7E6E2;--desk-2:#D8D6D0;--on-desk:#2A2A2D;--on-desk-sub:#6C6C71;--paper:#FAF9F6;--paper-line:rgba(0,0,0,0.09);
  --c-gray:#E7E8EC;--c-gray-t:#4F5260;--c-purple:#E8E0F7;--c-purple-t:#5B4B86;--c-pink:#F9DDE8;--c-pink-t:#8A4562;
  --c-cream:#FCEBCB;--c-cream-t:#7A5C2E;--c-green:#DDF1E3;--c-green-t:#3E6B4C;--c-blue:#DCE8FA;--c-blue-t:#2F5487;--c-orange:#FDE2CF;--c-orange-t:#8A4A1F;
  --tab-paper:#FFFFFF;--tab-paper-t:#1C1C1E;--tab-purple:#F1EDFA;--tab-purple-t:#5A4C85;--tab-cream:#FBF3E3;--tab-cream-t:#7A6036;--tab-blue:#EAF2FC;--tab-blue-t:#36598A;--tab-pink:#FBEDF2;--tab-pink-t:#8A4E68;--tab-green:#EBF6EE;--tab-green-t:#47705A;--tab-orange:#FCEFE6;--tab-orange-t:#86532F;
  --latin:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','Segoe UI',Roboto,sans-serif;
  --font:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;--hand:'Klee One','Hiragino Maru Gothic ProN',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141416;--surface:#1D1D20;--panel:#18181B;--rail:#111113;--ink:#EDEDEF;--sub:#A9ABB0;--muted:#7D7F85;--border:#2E2E33;
  --l-hour:rgba(255,255,255,0.17);--l-half:rgba(255,255,255,0.06);--l-col:rgba(255,255,255,0.10);--weekend:rgba(255,255,255,0.025);
  --seg:#26262A;--seg-on:#3A3A40;--ev-b:#8C8E94;--now:#6F9BF2;--today:#6F9BF2;--sat:#9AA8CC;--sun:#E08A80;--btn:#EDEDEF;--btn-t:#141416;--sw-off:#4A4A50;--done:#6F9BF2;
  --pen-k:#EDEDEF;--pen-b:#8EA9F0;--pen-r:#EA7B70;--pen-mc:#4FC9F5;--pen-mp:#FF77B7;--pen-my:#D6E96D;--sbar:#0E0F12;--desk:#0E0F12;--desk-2:#23262D;--on-desk:#F2F2F4;--on-desk-sub:#A9ADB7;--paper:#1D1D20;--paper-line:rgba(255,255,255,0.08);
  --c-gray:#2B2C31;--c-gray-t:#BDC0C8;--c-purple:#2E2840;--c-purple-t:#CFC2F2;--c-pink:#3D2730;--c-pink-t:#F2BDD2;
  --c-cream:#3D3323;--c-cream-t:#F0D6A6;--c-green:#22352A;--c-green-t:#B5E2C3;--c-blue:#22304A;--c-blue-t:#B8CCF2;--c-orange:#3D2A1E;--c-orange-t:#F3C2A0;
  --tab-paper:#2A2A2E;--tab-paper-t:#EDEDEF;--tab-purple:#2E2840;--tab-purple-t:#CFC2F2;--tab-cream:#3D3323;--tab-cream-t:#F0D6A6;--tab-blue:#22304A;--tab-blue-t:#B8CCF2;--tab-pink:#3D2730;--tab-pink-t:#F2BDD2;--tab-green:#22352A;--tab-green-t:#B5E2C3;--tab-orange:#3D2A1E;--tab-orange-t:#F3C2A0;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416;--surface:#1D1D20;--panel:#18181B;--rail:#111113;--ink:#EDEDEF;--sub:#A9ABB0;--muted:#7D7F85;--border:#2E2E33;
  --l-hour:rgba(255,255,255,0.17);--l-half:rgba(255,255,255,0.06);--l-col:rgba(255,255,255,0.10);--weekend:rgba(255,255,255,0.025);
  --seg:#26262A;--seg-on:#3A3A40;--ev-b:#8C8E94;--now:#6F9BF2;--today:#6F9BF2;--sat:#9AA8CC;--sun:#E08A80;--btn:#EDEDEF;--btn-t:#141416;--sw-off:#4A4A50;--done:#6F9BF2;
  --pen-k:#EDEDEF;--pen-b:#8EA9F0;--pen-r:#EA7B70;--pen-mc:#4FC9F5;--pen-mp:#FF77B7;--pen-my:#D6E96D;--sbar:#0E0F12;--desk:#0E0F12;--desk-2:#23262D;--on-desk:#F2F2F4;--on-desk-sub:#A9ADB7;--paper:#1D1D20;--paper-line:rgba(255,255,255,0.08);
  --c-gray:#2B2C31;--c-gray-t:#BDC0C8;--c-purple:#2E2840;--c-purple-t:#CFC2F2;--c-pink:#3D2730;--c-pink-t:#F2BDD2;
  --c-cream:#3D3323;--c-cream-t:#F0D6A6;--c-green:#22352A;--c-green-t:#B5E2C3;--c-blue:#22304A;--c-blue-t:#B8CCF2;--c-orange:#3D2A1E;--c-orange-t:#F3C2A0;
  --tab-paper:#2A2A2E;--tab-paper-t:#EDEDEF;--tab-purple:#2E2840;--tab-purple-t:#CFC2F2;--tab-cream:#3D3323;--tab-cream-t:#F0D6A6;--tab-blue:#22304A;--tab-blue-t:#B8CCF2;--tab-pink:#3D2730;--tab-pink-t:#F2BDD2;--tab-green:#22352A;--tab-green-t:#B5E2C3;--tab-orange:#3D2A1E;--tab-orange-t:#F3C2A0;
  color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--sbar,var(--desk));z-index:50}
.edgebar{display:none;position:fixed;left:0;right:0;height:11px;z-index:60;pointer-events:none}
#edge-top{top:0;background:var(--edge-top,var(--desk))}#edge-bot{bottom:0;background:var(--edge-bot,var(--desk))}
html[data-standalone] .edgebar{display:block}
html[data-standalone] #stage{top:calc(env(safe-area-inset-top,0px) + 11px);bottom:calc(env(safe-area-inset-bottom,0px) + 11px)}
#stage:has(#page:not([hidden])){background:var(--bg)}
#stage{position:fixed;inset:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#app{--sheetc:72px;--aw:1133px;--ah:744px;--th:56px;--bw:1133px;--bh:688px;--hw:566.5px;width:var(--aw);height:var(--ah);position:relative;flex:none;overflow:hidden;background:var(--bg);transform-origin:center center}
button,input,select{font-family:inherit;color:inherit}
input{-webkit-user-select:text;user-select:text}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.view{position:absolute;inset:0;transition:opacity .28s ease,transform .32s ease}
.view[hidden]{display:none!important}
.hw{font-family:var(--hand)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- book view ---------- */
#book{background:var(--desk);color:var(--on-desk)}
.bk-top{position:absolute;left:0;right:0;top:0;height:64px;padding:0 24px;display:flex;align-items:center;gap:10px}
.rb{width:38px;height:38px;border-radius:19px;border:none;background:var(--desk-2);color:var(--on-desk);display:flex;align-items:center;justify-content:center;padding:0}
.chap{height:30px;padding:0 12px;border-radius:15px;font-size:12px;border:none;background:var(--desk-2);color:var(--on-desk);white-space:nowrap}
.chap.on{background:var(--on-desk);color:var(--desk);font-weight:700}
.bk-title{position:absolute;left:172px;top:12px;text-align:left;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.bk-title b{font-size:20px;letter-spacing:.04em}
.bk-title span{font-size:12px;color:var(--on-desk-sub);font-variant-numeric:tabular-nums}
.book{--va:8deg;position:absolute;left:186px;top:151px;scale:1.25;width:760px;height:462px;perspective:1800px;perspective-origin:50% 40%;touch-action:none;cursor:grab}
.sheet{position:absolute;width:380px;background:#F1EFEA;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.half{position:absolute;top:0;width:380px;height:462px;overflow:hidden;background:var(--paper)}
.half.L{left:0;transform-origin:right center;transform:rotateY(var(--va));border-radius:8px 0 0 8px;box-shadow:-6px 10px 24px rgba(0,0,0,.35)}
.half.R{left:380px;transform-origin:left center;transform:rotateY(calc(-1 * var(--va)));border-radius:0 8px 8px 0;box-shadow:6px 10px 24px rgba(0,0,0,.35)}
.wrap{position:absolute;top:0;width:760px;height:462px;pointer-events:none}
.R>.wrap{left:-380px}.L>.wrap{left:0}
.thumb{position:absolute;left:0;top:0;width:1133px;height:688px;transform-origin:0 0;transform:scale(.67079);background:var(--bg);color:var(--ink);overflow:hidden}
.thumb img{position:absolute;left:0;top:0;width:1133px;height:688px}
.crease-L{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,0) 72%,rgba(0,0,0,.06) 88%,rgba(0,0,0,.16) 96%,rgba(0,0,0,.3) 100%)}
.crease-R{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,.14) 4%,rgba(0,0,0,.05) 12%,rgba(0,0,0,0) 28%)}
.leaf{position:absolute;top:0;width:380px;height:462px;transform-style:preserve-3d;pointer-events:none}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper)}
.face.back{transform:rotateY(180deg)}
.face.R{border-radius:0 8px 8px 0}.face.L{border-radius:8px 0 0 8px}
.face .shade{position:absolute;inset:0;pointer-events:none;background:#000;opacity:0}
.half.void{visibility:hidden}
.half.cv{background:transparent;overflow:visible}
.half.cv .crease-L,.half.cv .crease-R,.face.cvf .crease-L,.face.cvf .crease-R{display:none}
.half.R.cv{box-shadow:4px 3px 0 -1px rgba(0,0,0,.55),10px 16px 30px rgba(0,0,0,.45);border-radius:2px 10px 10px 2px}
.half.L.cv{box-shadow:-4px 3px 0 -1px rgba(0,0,0,.55),-10px 16px 30px rgba(0,0,0,.45);border-radius:10px 2px 2px 10px}
.face.cvf{background:transparent}
.cvsp{position:absolute;inset:0}
.cvr{position:absolute;top:0;width:380px;height:462px;box-sizing:border-box;background-color:var(--cv);
  background-image:radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.10),rgba(255,255,255,0) 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,rgba(0,0,0,.025) 2px 4px)}
.cvr.front{border-radius:2px 10px 10px 2px;box-shadow:inset 10px 0 12px -8px rgba(0,0,0,.45),inset -2px -2px 0 rgba(0,0,0,.18),inset 1px 1px 0 rgba(255,255,255,.12)}
.cvr.back{border-radius:10px 2px 2px 10px;box-shadow:inset -10px 0 12px -8px rgba(0,0,0,.45),inset 2px -2px 0 rgba(0,0,0,.18),inset -1px 1px 0 rgba(255,255,255,.12)}
.cv-in{position:absolute;left:44px;right:36px;top:64px;display:flex;flex-direction:column;gap:6px;color:var(--cvi)}
.cv-yr{font-family:var(--latin);font-size:64px;font-weight:300;letter-spacing:.06em;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.18),0 -1px 0 rgba(0,0,0,.25)}
.cv-sub{font-family:var(--latin);font-size:11px;font-weight:600;letter-spacing:.42em;opacity:.8}
.cv-band{position:absolute;right:46px;top:0;width:8px;height:150px;background:var(--cvi);opacity:.35;border-radius:0 0 3px 3px}
.cv-mark{position:absolute;left:0;right:0;bottom:36px;text-align:center;font-family:var(--latin);font-size:12px;letter-spacing:.3em;color:var(--cvi);opacity:.55}
.cvpick{position:absolute;left:50%;top:650px;transform:translateX(-50%);width:420px;display:flex;flex-direction:column;gap:5px;padding:8px 14px 10px;border-radius:14px;background:var(--desk-2);box-sizing:border-box;z-index:3}
.cvpick{animation:cvin .22s ease-out}
@keyframes cvin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.cvdone{margin-left:auto;height:26px;padding:0 14px;border:none;border-radius:14px;background:var(--on-desk);color:var(--desk);font-size:12px;font-weight:700}
.cvrow{display:flex;gap:8px;align-items:center;margin-bottom:2px}
.cvpick .cvsw{width:20px;height:20px;border-radius:10px;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.cvpick .cvsw.on{border-color:var(--on-desk)}
.cvsl{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--on-desk-sub)}
.cvsl span{width:52px;flex:none}
.cvsl input{flex:1;-webkit-appearance:none;appearance:none;height:10px;border-radius:5px;margin:0}
.cvsl input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:9px;background:#fff;border:1px solid rgba(0,0,0,.3);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cvsl input::-moz-range-thumb{width:18px;height:18px;border-radius:9px;background:#fff;border:1px solid rgba(0,0,0,.3)}
.shelf{position:absolute;left:0;right:0;top:170px;display:flex;justify-content:center;align-items:flex-end;gap:48px}
.sbook{width:380px;height:462px;padding:0;border:none;background:none;border-radius:2px 10px 10px 2px;box-shadow:4px 3px 0 -1px rgba(0,0,0,.55),10px 16px 30px rgba(0,0,0,.35);display:block;transform:scale(.72);transform-origin:bottom center;margin:0 -53px}
.sbook .cvr{top:0}
.sbook.empty{box-shadow:none;border:2px dashed var(--on-desk-sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--on-desk-sub);box-sizing:border-box}
.sbook.empty span{font-family:var(--latin);font-size:48px;font-weight:300;letter-spacing:.06em}
.sbook.empty small{font-size:14px}
.shelfline{position:absolute;left:180px;right:180px;top:636px;height:6px;border-radius:3px;background:var(--desk-2)}
.wrow{display:flex;justify-content:center;padding:4px 0;background:var(--surface);border:1px solid var(--border);border-radius:10px}
#wsl{width:100%;accent-color:var(--ink)}
.simp{position:absolute;inset:0;background:var(--paper);color:var(--ink)}
.simp .st{position:absolute;left:28px;top:18px;font-size:15px;font-weight:700}
.simp .sg{position:absolute;left:34px;right:28px;top:56px;bottom:24px}
.simp.week .sg{right:190px;background-image:linear-gradient(to right,var(--paper-line) 1px,transparent 1px),linear-gradient(to bottom,var(--paper-line) 1px,transparent 1px);background-size:calc(100% / 7) 100%,100% calc(100% / 9);border-right:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line)}
.simp.week .sp{position:absolute;right:28px;top:56px;width:150px;bottom:24px;background-image:linear-gradient(to bottom,var(--paper-line) 1px,transparent 1px);background-size:100% 22px}
.simp.month .sg{background-image:linear-gradient(to right,var(--paper-line) 1px,transparent 1px),linear-gradient(to bottom,var(--paper-line) 1px,transparent 1px);background-size:calc(100% / 7) 100%,100% calc(100% / 6);border-right:1px solid var(--paper-line);border-bottom:1px solid var(--paper-line)}
.simp.quarter .sg,.simp.goal .sg,.simp.ideas .sg,.simp.ideanote .sg,.simp.tasks .sg{background-image:linear-gradient(to bottom,var(--paper-line) 1px,transparent 1px);background-size:100% 22px}
.flipcount{position:absolute;top:496px;left:50%;transform:translateX(-50%);background:var(--on-desk);color:var(--desk);font-size:13px;font-weight:700;padding:4px 12px;border-radius:14px;pointer-events:none;font-variant-numeric:tabular-nums}
.flipcount[hidden]{display:none}
.flipcount.fade{opacity:0;transition:opacity .35s ease}
.flipcount.big{font-size:20px;padding:6px 18px;border-radius:20px;letter-spacing:.04em}
.bkbackup{position:absolute;left:24px;bottom:24px;display:flex;gap:8px;z-index:2}
.bkreset{height:30px;padding:0 12px;border:1px solid var(--desk-2);border-radius:15px;background:none;color:var(--on-desk-sub);font-size:11.5px;z-index:2}
.bkreset.arm{background:#C8483E;border-color:#C8483E;color:#fff;font-weight:700}
.bk-hint{position:absolute;left:0;right:0;bottom:30px;display:flex;justify-content:center;gap:28px;font-size:12px;color:var(--on-desk-sub)}

/* ---------- page view ---------- */
#page{background:var(--bg)}
.itabs{align-self:flex-end;display:flex;align-items:flex-end;gap:3px;height:100%;margin-bottom:-1px;flex:none}
.itab{--tc:var(--surface);height:40px;width:56px;padding:0;letter-spacing:.05em;font-variant-numeric:tabular-nums;border:1px solid var(--border);border-bottom:none;border-radius:10px 10px 0 0;background:var(--tc);color:var(--tt);font-size:13.5px;font-weight:500;white-space:nowrap;opacity:.92;transform:translateY(6px);transition:transform .15s,opacity .15s;box-shadow:inset 0 -6px 8px -6px rgba(0,0,0,.10)}
.itab:hover{opacity:1;transform:translateY(3px)}
.itab.on{height:46px;opacity:1;filter:none;transform:none;font-weight:700;font-size:15px;box-shadow:0 -2px 6px rgba(0,0,0,.08);border-color:var(--border);position:relative;z-index:1}
.itab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--tc)}
.dayttl{display:flex;align-items:center;gap:8px;height:44px;margin-left:44px;flex:none}
.dayttl b{font-size:30px;line-height:1;letter-spacing:-.02em}
.dayttl span{display:flex;flex-direction:column;line-height:1.15;font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--sub)}
.dayttl span i{font-style:normal;font-size:11px;color:var(--muted);font-weight:500}
.dayttl.sat b,.dayttl.sat span{color:var(--sat)}.dayttl.sun b,.dayttl.sun span{color:var(--sun)}
.dayttl em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--today);margin-left:2px}
.dayttl.today b,.dayttl.today span{color:var(--today);font-weight:800}
.rgrp{display:flex;align-items:center;gap:0}
.rgrp .goalbtn[aria-disabled="true"]{cursor:default}
#tbx .rdo{color:var(--done)}
.backb{display:flex;align-items:center;gap:2px;padding:0 12px 0 6px;font-size:12px;font-weight:700}
.tplttl{display:flex;align-items:center;gap:6px;font-size:17px;margin-left:4px;letter-spacing:.02em}
.en,.itab,.nowb,.goalbtn,.segrow .segs button,.tplttl,.dayttl span,.dayttl em,.wkmon,.backb,.bk-top .chap{font-family:var(--latin)}
.en{letter-spacing:.08em}
.tight .itab{width:50px;letter-spacing:.02em}.tight .itab.on{width:54px}
.navs{display:flex;align-items:center;gap:2px;margin-left:6px}
.nowb{height:28px;padding:0 9px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--ink);padding:0;flex:none}
.nowb:disabled{opacity:.3}
.dttl{font-size:15px;white-space:nowrap;padding:0 4px}
.chapseg{display:flex;background:var(--seg);border-radius:10px;padding:3px;gap:2px;flex:none}
.chapseg button{height:30px;padding:0 8px;border:none;border-radius:8px;background:none;font-size:12px;color:var(--sub);white-space:nowrap}
.chapseg button.on{background:var(--seg-on);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bookbtn2{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink);flex:none}
#gfloat{position:absolute;right:12px;top:64px;z-index:13;width:270px;max-height:calc(100% - 80px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px}
#gfloat .card{border:none;padding:4px;background:transparent}
#tbx{position:absolute;z-index:12;display:flex;align-items:center;gap:3px;height:48px;padding:0 8px 0 4px;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.14);touch-action:none}
#tbx[hidden]{display:none!important}
#tbx .grip{width:22px;height:36px;border:none;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;cursor:grab;touch-action:none}
#tbx.dock{box-shadow:none;height:44px;border-color:var(--border)}
#tbx.drag{box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:.95}
#tbx .rtgl{height:32px;border:none;background:var(--seg)}
#tbx .goalbtn{height:34px;width:50px;padding:0;justify-content:center}
#tbx .goalbtn svg{width:19px;height:19px}
#tbx .tool svg{width:22px;height:22px}
#tbx .rgrp{gap:2px}
#tbx .pens{gap:2px}
#tbx .tool{width:38px;height:36px}
#tbx .pen{width:32px;height:32px;border-radius:16px}
#tbx .pen i{width:18px;height:18px;border-radius:9px}
#tbx .pen.mk i{width:20px;height:11px;border-radius:2px}
.rail{position:absolute;left:0;top:0;bottom:0;width:48px;background:var(--rail);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:6px;padding-top:10px;box-sizing:border-box;z-index:3}
.rail .bookbtn{width:40px;height:40px;margin:0 4px 6px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;padding:0;color:var(--ink)}
.tab{width:44px;border:none;border-radius:0 10px 10px 0;writing-mode:vertical-rl;text-orientation:upright;font-size:13px;letter-spacing:.12em;display:flex;align-items:center;justify-content:center;padding:0;background:none;color:var(--sub)}
.tab.on{background:var(--bg);color:var(--ink);font-weight:700}
.top{position:absolute;left:0;right:0;top:0;height:var(--th);box-sizing:border-box;padding:0 14px 0 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);background:var(--bg);z-index:3}
.navb{width:30px;height:36px;border:none;background:none;display:flex;align-items:center;justify-content:center;padding:0}
.ttl{display:flex;flex-direction:column;line-height:1.2;flex:none}
.ttl b{font-size:16px;white-space:nowrap}
.ttl span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{height:30px;padding:0 12px;border:1px solid var(--border);background:var(--surface);border-radius:15px;font-size:13px;white-space:nowrap}
.pens{display:flex;align-items:center;gap:5px;margin-left:auto;padding:0 8px;height:40px;border:1px solid var(--border);border-radius:20px;background:var(--surface)}
.pen{width:26px;height:26px;border-radius:13px;border:2px solid transparent;background:none;display:flex;align-items:center;justify-content:center;padding:0}
.pen i{width:14px;height:14px;border-radius:7px;display:block}
.pen.on{border-color:var(--ink)}
#lsbar{position:absolute;z-index:6;display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
#lsbar button{height:28px;padding:0 10px;border:none;border-radius:7px;background:var(--seg);font-size:12px;color:var(--ink)}
#lsbar button[data-ls=del]{color:#C8483E}
.pen.mk i{width:16px;height:9px;border-radius:2px;opacity:.55;transform:rotate(-20deg)}
.tool{width:30px;height:30px;border:none;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center;padding:0;border-radius:8px}
.tool.on{background:var(--seg);color:var(--ink)}
.vsep{width:1px;height:20px;background:var(--border)}
.rtgl{display:flex;align-items:stretch;height:36px;border:1px solid var(--border);border-radius:18px;background:var(--surface);overflow:hidden;flex:none}
.rtgl button{border:none;background:none;display:flex;align-items:center;gap:6px;font-size:12px;padding:0 8px 0 10px;white-space:nowrap}
.rtgl .ed{border-left:1px solid var(--border);color:var(--sub);padding:0 12px;font-size:12px}
.sw{width:34px;height:20px;border-radius:10px;position:relative;display:inline-block;background:var(--sw-off);transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:var(--ink)}.sw.on::after{left:16px}
.goalbtn{height:36px;padding:0 12px;border-radius:18px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;border:1px solid var(--border);background:var(--surface);flex:none}
.goalbtn.on{background:var(--btn);color:var(--btn-t);border-color:var(--btn)}
#pbody{position:absolute;left:0;top:var(--th);width:var(--bw);height:var(--bh);overflow:hidden;touch-action:none}
#zw{position:absolute;left:0;top:0;width:var(--bw);height:var(--bh);transform-origin:0 0}
#ink{position:absolute;left:0;top:0;width:var(--bw);height:var(--bh);pointer-events:none;z-index:8}
.pstatic{position:absolute;left:0;top:0;width:var(--bw);height:var(--bh);background:var(--bg);color:var(--ink);overflow:hidden;pointer-events:none}
.pstatic img{position:absolute;left:0;top:0;width:var(--bw);height:var(--bh);z-index:12}
.phalf{position:absolute;top:0;width:var(--hw);height:var(--bh);overflow:hidden;pointer-events:none;background:var(--bg)}
.phalf.L{left:0}.phalf.R{left:var(--hw)}
.phalf .pin{position:absolute;top:0;width:var(--bw);height:var(--bh)}
.phalf.L .pin{left:0}.phalf.R .pin{left:calc(-1 * var(--hw))}
#turnlayer{position:absolute;left:0;top:var(--th);width:var(--bw);height:var(--bh);z-index:10;pointer-events:none;perspective:1500px;perspective-origin:var(--hw) 40%}
.pleaf{position:absolute;top:0;width:var(--hw);height:var(--bh);transform-style:preserve-3d;z-index:6;pointer-events:none}
.pleaf .face2{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--bg)}
.pleaf .face2.back{transform:rotateY(180deg)}
.pleaf .sh{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.pcrease{position:absolute;top:0;bottom:0;left:calc(50% - 30px);width:60px;pointer-events:none;z-index:5;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.10) 48%,rgba(0,0,0,.16) 50%,rgba(0,0,0,.10) 52%,rgba(0,0,0,0));opacity:0}
.pdim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5}
.zoomreset{position:absolute;left:12px;top:10px;z-index:9;height:30px;padding:0 12px;border:none;border-radius:15px;background:var(--btn);color:var(--btn-t);font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.turn-next{animation:tn .3s ease}.turn-prev{animation:tp .3s ease}
@keyframes tn{from{transform:perspective(2000px) translateX(60px) rotateY(-8deg);opacity:.15}to{transform:none;opacity:1}}
@keyframes tp{from{transform:perspective(2000px) translateX(-60px) rotateY(8deg);opacity:.15}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.turn-next,.turn-prev{animation:none}.view{transition:none}}

/* week */
.wk{position:absolute;inset:0;display:flex}
.wk-main{flex:1;min-width:0;display:flex;flex-direction:column;padding:6px 12px 14px 4px}
.dayhead{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-left:34px;height:44px;align-items:center;position:relative}
.wkmon{position:absolute;left:-36px;top:0;width:36px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-size:11px;color:var(--sub);font-weight:700}
.wkmon b{font-size:21px;color:var(--ink);letter-spacing:-.02em;margin-bottom:1px}
.dh{border:none;background:none;font-size:13px;color:var(--sub);display:flex;align-items:center;justify-content:center;gap:5px;height:40px;border-radius:8px;padding:0}
.dh b{font-size:17px;color:var(--ink)}
.dh.sat{color:var(--sat)}.dh.sun{color:var(--sun)}
.dh.sat b,.dh.sun b{color:inherit}
.dh.today,.dh.today b{color:var(--today);font-weight:800}
.adrow{display:flex;align-items:stretch;margin-bottom:4px}
.dtl{border:none;background:none;padding:0 6px 0 0;cursor:pointer;font-family:var(--latin);letter-spacing:.04em;font-size:9.5px;font-weight:700}
.dtstrip{flex:1;min-width:0;height:62px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--l-col);border-radius:6px;overflow:hidden}
.dtstrip.mini{height:20px}
.dtbox{min-width:0;border-left:1px solid var(--l-col);padding:2px 4px;overflow-y:auto;display:flex;flex-direction:column;gap:0;transition:background .12s}
.dtbox:first-child{border-left:none}
.dtbox.td{background:rgba(0,0,0,.025)}
.pdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;flex:none}
.pd{height:28px;padding:0;border:1px solid var(--border);border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .12s}
.pd b{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.pd.sat{color:var(--sat)}.pd.sun{color:var(--sun)}
.pd.td{color:var(--today)}.pd.td b{font-weight:800}
.pd.on{background:var(--btn);border-color:var(--btn);color:var(--btn-t)}
.pd.drop{background:var(--c-blue);outline:2px dashed var(--done);outline-offset:-2px}
.dtbox.drop,.tsec.drop{background:var(--c-blue);outline:2px dashed var(--done);outline-offset:-2px}
.dti{display:flex;align-items:center;gap:4px;font-size:10.5px;min-height:19px;cursor:grab;touch-action:none}
.dti .box{width:13px;height:13px;border-radius:4px;border-width:1.3px}
.dti .box svg{width:9px;height:9px}
.dti span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dti.done span{color:var(--muted);text-decoration:line-through}
.dtn{font-size:10px;color:var(--sub);margin:auto}
.panel .tlist .task{cursor:grab;touch-action:pan-y}
/* ---------- portrait (week / day only) ---------- */
.dleft{width:300px;flex:none;display:flex;flex-direction:column;padding:6px 10px 14px 4px}
#app.port .top{align-items:flex-end}
#app.port .top > .bookbtn2,#app.port .top > .navs{margin-bottom:8px}
#app.port .wk-main{padding-bottom:6px;padding-right:30px}
#app.port .gw{flex:none;height:var(--gwh,auto)}
.shandle{display:none}
.panel.tplp{padding-bottom:20px;overflow:auto}
#app.port .wk > .panel.tplp:not(.open){overflow:hidden}
#app.port #ink{z-index:11}
#app.port .wk > .panel{position:absolute;left:0;right:0;bottom:0;width:auto;height:var(--sheetc);border-left:none;border-top:1px solid var(--border);border-radius:18px 18px 0 0;box-shadow:0 -8px 26px rgba(0,0,0,.13);z-index:10;padding:0 18px 18px;gap:10px;overflow:hidden;transition:height .28s cubic-bezier(.3,.7,.3,1)}
#app.port .wk > .panel.open{height:52%}
#app.port .wk > .panel.open.withgoals{overflow-y:auto}
#app.port .wk > .panel.drag{transition:none}

#app.port .shandle::before{content:"";width:44px;height:5px;border-radius:3px;background:var(--border)}
#app.port .wk > .panel > .pdays{order:-2;margin-left:20px;margin-right:12px}   /* under the 7 columns: grid starts at 4+34px, ends 30px from the right; sheet padding 18px */
#app.port .pd{height:50px;border-radius:12px;flex-direction:column;gap:1px}
#app.port .pd small{font-size:10px;font-weight:500;line-height:1;opacity:.75}
#app.port .pd b{font-size:15px;line-height:1.1}
.pdots{display:flex;gap:2px;height:7px;align-items:center}
.pdots i{width:6px;height:6px;border-radius:3px;background:currentColor;display:block}
.pdots i.dn{background:var(--done)}
#app.port .pd.on .pdots i:not(.dn){background:var(--btn-t)}
#app.port .wk > .panel .msec.open{flex:1 1 auto;min-height:160px}
#app.port .fab{bottom:calc(var(--sheetc) + 14px)}
#pbody.sheetopen .fab{bottom:calc(var(--bh) * .52 + 14px)}
#app.port .evx.evx-half{width:100%;top:auto;bottom:0;height:62%;border-left:none;border-top:1px solid var(--border);box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.capb{width:30px;height:30px;border-radius:15px;border:none;background:var(--btn);color:var(--btn-t);display:flex;align-items:center;justify-content:center;padding:0;flex:none;margin-left:4px}
.capb svg{width:16px;height:16px}
#app.port .top > .capb{margin-bottom:11px}
/* portrait sheet: compact day boxes, two-column task list, bigger memo */
#app.port .pd{height:38px;display:grid;grid-template-columns:auto auto;justify-content:center;align-content:center;align-items:baseline;column-gap:3px;row-gap:2px;border-radius:10px}
#app.port .pd small{font-size:10px}
#app.port .pd b{font-size:14px;line-height:1}
#app.port .pdots{grid-column:1 / -1;justify-self:center;height:6px}
#app.port .pdots i{width:5px;height:5px}
#app.port .wk > .panel.open{height:60%}
#app.port .wk > .panel .tsec{flex:0 1 auto;max-height:50%;min-height:0;overflow:hidden}
#app.port .wk > .panel .tlist{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:16px;align-content:start}
#app.port .wk > .panel .msec.open,#app.port .wk > .panel .evmemo.msec.open{flex:1 1 auto;min-height:100px}
#tdghost{position:absolute;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--ink);border-radius:8px;padding:5px 10px;font-size:12px;box-shadow:0 8px 20px rgba(0,0,0,.2);white-space:nowrap}
.adl{width:34px;flex:none;font-size:10px;color:var(--muted);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;box-sizing:border-box}
.adstrip{position:relative;flex:1;min-width:0;background:var(--surface);border:1px solid var(--l-col);border-radius:6px;background-image:linear-gradient(to right,var(--l-col) 1px,transparent 1px);background-size:calc(100% / 7) 100%;touch-action:none}
.adbar{position:absolute;height:20px;border-radius:5px;font-size:11px;font-weight:700;padding:0 6px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;background:var(--surface);border:1px solid var(--ev-b);color:var(--ink);z-index:2}
.adbar .dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:4px;vertical-align:0}
.adbar.sel{outline:2px solid var(--ink);outline-offset:-1px;z-index:6}
.adstrip .selbox{height:20px;top:2px;padding:0 6px;flex-direction:row;align-items:center;gap:6px}
.xb{width:30px;height:30px;border:none;background:none;color:var(--sub);display:flex;align-items:center;justify-content:center;padding:0;border-radius:8px;flex:none}
.xb:hover{background:var(--seg)}
.evx{position:absolute;top:0;height:var(--bh);right:0;z-index:7;background:var(--panel);display:flex;flex-direction:column;gap:12px;padding:14px 18px 18px;box-sizing:border-box}
.evx.evx-half{width:50%;border-left:1px solid var(--border);box-shadow:-10px 0 30px rgba(0,0,0,.10)}
.evx.evx-full{left:0;flex-direction:row;gap:0;padding:0;background:var(--bg)}
.evx-h{display:flex;align-items:center;gap:6px;flex:none}
.evx-h b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.evx-h span{font-size:12px;color:var(--muted)}
.evx-seg{width:76px;flex:none}.evx-seg button{display:flex;align-items:center;justify-content:center;height:28px}
.evx .k{font-size:11px;color:var(--muted)}
.evx-todos{display:flex;flex-direction:column;gap:2px;flex:none;max-height:34%;overflow:auto}

.evx-todos .todo.done .tt{color:var(--muted);text-decoration:line-through}
.evx-memo{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}

.evx-tl{width:20%;flex:none;display:flex;flex-direction:column;padding:12px 8px 14px 4px;box-sizing:border-box;border-right:1px solid var(--border);background:var(--panel)}

.evx-tl .blk.ev{cursor:pointer}
.evx-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;padding:14px 22px 18px}
.evx-body{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3fr);gap:20px}

.panel .evmemo.msec.open{flex:0 0 60%}

.evmemo .k{font-size:11px;color:var(--muted)}
.todo{display:flex;align-items:center;gap:8px;font-size:13px;min-height:28px}
.todo.done span{color:var(--muted);text-decoration:line-through}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;border:none;background:none;padding:3px 4px;border-radius:6px;text-align:left;width:100%}
.legend-row:hover{background:var(--panel)}
.allday{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-left:34px;gap:0;min-height:0}
.allday div{padding:0 2px 3px;display:flex;flex-direction:column;gap:2px;min-width:0}
.adc{font-size:10.5px;border-radius:4px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid var(--ev-b);background:var(--surface)}
.gw{flex:1;min-height:0;display:flex}
.tlab{width:34px;position:relative;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.tlab span{position:absolute;right:6px;transform:translateY(-50%)}
.grid{flex:1;min-width:0;position:relative;background:var(--surface);border-bottom:1px solid var(--l-hour);border-right:1px solid var(--l-col)}
.lines{position:absolute;inset:0;pointer-events:none;z-index:1;background-image:linear-gradient(to bottom,var(--l-hour) 0,var(--l-hour) 1px,transparent 1px,transparent 50%,var(--l-half) 50%,var(--l-half) calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(to right,var(--l-col) 0,var(--l-col) 1px,transparent 1px);background-size:100% calc(100% / var(--hn, 15)),calc(100% / 7) 100%}
.lines.one{background-image:linear-gradient(to bottom,var(--l-hour) 0,var(--l-hour) 1px,transparent 1px,transparent 50%,var(--l-half) 50%,var(--l-half) calc(50% + 1px),transparent calc(50% + 1px));background-size:100% calc(100% / var(--hn, 15))}
.blk{position:absolute;box-sizing:border-box;border-radius:4px;font-size:11px;padding:2px 6px;overflow:hidden;white-space:nowrap;line-height:1.35}
.blk small{display:block;font-size:10px;opacity:.85;font-variant-numeric:tabular-nums}
.blk .mo{font-size:9px;border:1px solid currentColor;border-radius:3px;padding:0 2px;margin-left:3px}

function monthCal(y, m, opt = {}) {

/* ---- continuous flip ("roulette"): a new leaf every SP_GAP ms; touch anywhere to stop on the page in view ---- */
let SP = null;
const SP_GAP = 85, SP_DUR = 230;

  const fc = $('#fc'); fc.hidden = false; fc.classList.add('big');
  const label = n => { if (n === 0) return '表紙'; if (n === BMAX) return '裏表紙'; const i = info(n);
    return i.type === 'week' ? (weekStart(i.w).getMonth() + 1) + '月' : i.type === 'month' ? i.m + '月' : i.type === 'quarter' ? 'Q' + i.q : i.type === 'goal' ? '目標' : i.type === 'ideas' ? '思いつき' : i.type === 'tasks' ? 'やること' : 'ノート'; };
  const dep = dir === 1 ? $('#hR') : $('#hL'), side = dir === 1 ? 'R' : 'L';

book.addEventListener('pointerdown', e => { if (SP && !SP.stop) { SP.stop = true; e.stopPropagation(); e.preventDefault(); } }, true);
function startFlip(dir) {

  setHalf(dir === 1 ? $('#hR') : $('#hL'), BN + dir, dir === 1 ? 'R' : 'L');

}
function runFlip(complete) {

book.addEventListener('click', e => {

  if (b.dataset.bk === 'shelf') renderShelf();

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#page').hidden) { if (!pop.hidden) { closePop(true); e.preventDefault(); return; } if (pb.querySelector('.selbox')) { removeSel(); return; } if (SEL) { SEL = null; renderBody(); return; } }
});
document.addEventListener('keydown', e => {
  if (book.hidden || e.target.tagName === 'INPUT' || F) return;

/* ================= scale & boot ================= */
let scale = 1;
/* portrait is used for the week and day pages only; everything else (and the book) keeps the landscape page, scaled to fit */
function wantPort() { return window.innerHeight > window.innerWidth * 1.05 && !VIEWBOOK && (V.mode === 'day' || V.mode === 'tplWeek' || (V.mode === 'page' && info(V.n).type === 'week')); }
function syncPort() {
  const p = wantPort(), changed = p !== PORT;
  PORT = p; W_APP = p ? 744 : 1133; H_APP = p ? 1133 : 744;
  HS = p ? 5 : 7; HN = p ? 19 : 15; app.style.setProperty('--hn', HN);
  const th = p ? 100 : 56; BODY_W = W_APP; BODY_H = H_APP - th;
  const st = app.style;
  st.setProperty('--aw', W_APP + 'px'); st.setProperty('--ah', H_APP + 'px'); st.setProperty('--th', th + 'px');
  st.setProperty('--bw', BODY_W + 'px'); st.setProperty('--bh', BODY_H + 'px'); st.setProperty('--hw', (BODY_W / 2) + 'px');

function themeColor() {

try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(themeColor, 50)); } catch (e) {}

}
